<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數學遊戲</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:#eef6ff;color:#263238}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#fff;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:5;font-weight:800}.bar a,.bar button{border:0;background:#eceff1;color:#263238;text-decoration:none;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer}.who{flex:1;text-align:center}iframe{display:block;width:100%;height:calc(100vh - 58px);border:0;background:#fff}@media(max-width:600px){.bar{font-size:13px;padding:8px}.bar a,.bar button{padding:7px}.who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}</style></head><body><div class="bar"><a href="./">← 遊戲入口</a><div class="who" id="who"></div><button id="change">更換學生</button></div><iframe id="game" title="數學遊戲"></iframe><script>const KEY='mathGameStudentV1',ENDPOINT='https://script.google.com/macros/s/AKfycbztecQCAVcFpNu0qlJmUPHYp88FJKN4aAvfbFWXTgSCDtNpGUAPHqoYiMF1noy6sjac/exec';let s;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!s||!s.className||!s.seatNo||!s.studentName)location.replace('./');else document.getElementById('who').textContent='👤 '+s.className+'班｜'+s.seatNo+'號｜'+s.studentName;document.getElementById('change').onclick=()=>{localStorage.removeItem(KEY);location.href='./'};const allowed={multiplication:'games/g8-multiplication-commutative/',like:'games/g8-like-terms/',combine:'games/g8-combine-like-terms/',remove:'games/g8-remove-parentheses/',poly:'games/g8-polynomial-add-subtract/'};const key=new URLSearchParams(location.search).get('game')||'like',src=allowed[key]||allowed.like,frame=document.getElementById('game');frame.src=src;frame.onload=()=>{const d=frame.contentDocument,w=frame.contentWindow;if(key==='multiplication'){const c=d.getElementById('className'),no=d.getElementById('seatNo'),n=d.getElementById('studentName'),btn=d.getElementById('loginBtn');if(c&&no&&n&&btn){c.value=s.className;no.value=s.seatNo;n.value=s.studentName;btn.click()}return}d.addEventListener('click',e=>{const b=e.target.closest('.ans');if(!b||b.disabled)return;setTimeout(()=>{const all=[...d.querySelectorAll('.ans')],cb=all.find(x=>x.classList.contains('ok'));if(!cb)return;const dots=[...d.querySelectorAll('.dot')],rc=dots.filter(x=>x.classList.contains('ok')).length,answered=dots.filter(x=>x.classList.contains('ok')||x.classList.contains('no')).length;const lab=d.getElementById('lab')?.textContent||d.getElementById('levelLabel')?.textContent||'';const payload={className:s.className,seatNo:s.seatNo,studentName:s.studentName,level:d.title+'｜'+lab,question:d.getElementById('q')?.textContent||'',studentAnswer:b.textContent,correctAnswer:cb.textContent,isCorrect:b.classList.contains('ok'),total:Number(d.getElementById('total')?.textContent||0),correctTotal:'',recentCorrect:rc,passed:answered===6&&rc>=5};fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).catch(()=>{})},50)},true)};</script></body></html>
