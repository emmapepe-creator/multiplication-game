<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國二數學｜辨識同類項</title><style>:root{--ink:#263238;--muted:#607d8b;--p:#5b63c8;--good:#2e7d32;--bad:#c62828;--line:#dfe7fd}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:linear-gradient(180deg,#eef7ff,#fff8e6);color:var(--ink);min-height:100vh;padding:18px}.app{max-width:920px;margin:auto;background:#fff;border-radius:28px;padding:24px;box-shadow:0 14px 35px #455a6422}h1{text-align:center;font-size:clamp(30px,5vw,48px);margin:4px}.sub{text-align:center;color:var(--muted);font-size:18px;line-height:1.6}.screen{display:none}.screen.on{display:block}.rule{background:#eef1ff;border-radius:20px;padding:18px;margin:20px 0;text-align:center;font-size:20px;line-height:1.7}.rule b{font-size:25px;color:#4b53b7}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card,.ans{border:3px solid var(--line);background:#fff;border-radius:20px;padding:18px;cursor:pointer;font-weight:900}.card{text-align:left;min-height:150px}.card b{display:block;font-size:24px;margin:8px 0}.card span{color:var(--muted);font-size:16px;line-height:1.5}.emoji{font-size:38px}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{background:#f1f3f4;border-radius:999px;padding:9px 14px;font-weight:800}.prompt{text-align:center;font-size:20px;font-weight:900;margin:22px 0 8px}.q{text-align:center;font-size:clamp(34px,7vw,58px);font-weight:900;margin:14px 0 22px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ans{font-size:clamp(22px,4vw,32px);min-height:100px}.ans.ok{background:#e8f5e9;border-color:#66bb6a;color:var(--good)}.ans.no{background:#ffebee;border-color:#ef9a9a;color:var(--bad)}.feedback{text-align:center;min-height:64px;font-size:20px;font-weight:900;line-height:1.5;margin-top:14px}.history{display:flex;justify-content:center;gap:8px;margin:14px}.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#eceff1;font-weight:900}.dot.ok{background:#c8e6c9;color:var(--good)}.dot.no{background:#ffcdd2;color:var(--bad)}.status{text-align:center;color:var(--muted)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}button.primary,button.secondary{border:0;border-radius:15px;padding:13px 20px;font-size:18px;font-weight:900;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#eceff1}.result{text-align:center;padding:28px}.t{font-size:78px}a.secondary{text-decoration:none;color:var(--ink);border-radius:15px;padding:13px 20px;font-size:18px;font-weight:900;background:#eceff1}@media(max-width:600px){.cards,.answers{grid-template-columns:1fr}.app{padding:16px}}</style></head><body><main class="app"><h1>🧩 辨識同類項</h1><p class="sub">國二數學｜先看「文字部分」是不是完全相同，再判斷是不是同類項。</p><section id="menu" class="screen on"><div class="rule"><b>同類項判斷重點</b><br>文字相同，而且相同文字的次方也相同，就是同類項。<br>例如：<b>3x</b> 和 <b>−5x</b> 是同類項；<b>2x²</b> 和 <b>7x</b> 不是。</div><div class="cards"><button class="card" data-level="1"><div class="emoji">🌱</div><b>第一關｜單一文字</b><span>辨識 x、y 等單一文字的同類項，例如 3x 與 −5x。</span></button><button class="card" data-level="2"><div class="emoji">🔍</div><b>第二關｜含次方</b><span>注意 x 和 x² 不相同，練習看清楚文字的次方。</span></button><button class="card" data-level="3"><div class="emoji">🚀</div><b>第三關｜兩個文字</b><span>辨識 xy、x²y、xy² 等較複雜的文字部分。</span></button><button class="card" data-level="4"><div class="emoji">🏆</div><b>第四關｜綜合挑戰</b><span>單一文字、次方、兩個文字混合出題。</span></button></div><p class="status">每關最近 6 題答對至少 5 題即可過關。</p><div class="actions"><a class="secondary" href="../../">← 回數學遊戲入口</a></div></section><section id="game" class="screen"><div class="top"><span class="pill" id="levelLabel"></span><span class="pill">總答題 <span id="total">0</span> 題</span></div><div class="prompt">找出和下面這一項「同類」的項：</div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="history" id="history"></div><div class="status" id="status"></div><div class="actions"><button class="primary" id="next" hidden>下一題</button><button class="secondary" id="back">回到選關</button></div></section><section id="result" class="screen"><div class="result"><div class="t">🏆</div><h2 id="resultTitle">挑戰成功！</h2><p id="summary"></p><div class="actions"><button class="primary" id="again">再挑戰一次</button><button class="secondary" id="choose">選其他關卡</button><a class="secondary" href="../../">回數學遊戲入口</a></div></div></section></main><script>const $=id=>document.getElementById(id);let level=1,recent=[],total=0,correct=0,current=null,locked=false;const labels=['','第一關｜單一文字','第二關｜含次方','第三關｜兩個文字','第四關｜綜合挑戰'];const simple=['x','y','a','b'];const powers=['x','x²','x³','y','y²','a','a²','b²'];const multi=['xy','x²y','xy²','ab','a²b','ab²'];function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){for(let i=a.length-1;i;i--){let j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}function coeff(){let n=r(1,9);return Math.random()<.35?-n:n}function term(c,v){if(c===1)return v;if(c===-1)return '−'+v;return (c<0?'−'+Math.abs(c):c)+v}function pool(){if(level===1)return simple;if(level===2)return powers;if(level===3)return multi;return [...simple,...powers,...multi]}function start(n){level=n;recent=[];total=0;correct=0;$('levelLabel').textContent=labels[level];show('game');render();newQ()}function newQ(){locked=false;$('next').hidden=true;$('feedback').textContent='';let p=pool(),v=p[r(0,p.length-1)],q=term(coeff(),v),answer=term(coeff(),v);while(answer===q)answer=term(coeff(),v);let wrongVars=shuffle([...new Set(p.filter(x=>x!==v))]).slice(0,3);while(wrongVars.length<3){let z=['z','z²','xz','yz'][r(0,3)];if(z!==v&&!wrongVars.includes(z))wrongVars.push(z)}let opts=[answer,...wrongVars.map(x=>term(coeff(),x))];current={v,q,answer};$('q').textContent=q;let box=$('answers');box.innerHTML='';shuffle(opts).forEach(t=>{let b=document.createElement('button');b.className='ans';b.textContent=t;b.onclick=()=>check(b,t);box.appendChild(b)})}function check(btn,t){if(locked)return;locked=true;total++;let ok=t===current.answer;if(ok)correct++;recent.push(ok);if(recent.length>6)recent.shift();[...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===current.answer)b.classList.add('ok')});if(!ok)btn.classList.add('no');$('feedback').textContent=ok?`✅ 答對了！兩項的文字部分都是 ${current.v}。`:`❌ 再看文字部分：${current.q} 的文字部分是 ${current.v}，所以答案是 ${current.answer}。`;$('feedback').style.color=ok?'#2e7d32':'#c62828';render();if(recent.length===6&&recent.filter(Boolean).length>=5)setTimeout(pass,650);else $('next').hidden=false}function render(){$('total').textContent=total;let h=$('history');h.innerHTML='';for(let i=0;i<6;i++){let d=document.createElement('span');d.className='dot';if(i<recent.length){d.textContent=recent[i]?'✓':'×';d.classList.add(recent[i]?'ok':'no')}else d.textContent='•';h.appendChild(d)}$('status').textContent=`最近 ${recent.length}/6 題｜答對 ${recent.filter(Boolean).length} 題｜過關需 5 題`}function pass(){$('resultTitle').textContent=`${labels[level]} 過關！`;$('summary').textContent=`本次共作答 ${total} 題，答對 ${correct} 題；最近 6 題答對 ${recent.filter(Boolean).length} 題。`;show('result')}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(Number(b.dataset.level)));$('next').onclick=newQ;$('back').onclick=()=>show('menu');$('choose').onclick=()=>show('menu');$('again').onclick=()=>start(level);</script></body></html>
