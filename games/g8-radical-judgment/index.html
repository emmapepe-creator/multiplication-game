<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國二數學｜判斷平方根</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;font-family:"Microsoft JhengHei",sans-serif;background:#f3f6ff;color:#263238}.app{max-width:850px;margin:auto}.box{background:#fff;border-radius:22px;padding:20px;margin:14px 0}h1{text-align:center}.levels,.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.level,.ans,.next{border:3px solid #dce4fa;background:#fff;border-radius:15px;padding:15px;font-size:18px;font-weight:900;cursor:pointer}.level.on,.next{background:#5964c7;color:#fff}.q{text-align:center;font-size:40px;font-weight:900;margin:22px}.hint{text-align:center;background:#f5f7ff;border-radius:15px;padding:16px;line-height:1.8}.square{background:#fff0b8;border-radius:8px;padding:3px 8px}.ans.ok{background:#e8f5e9;border-color:#4caf50}.ans.no{background:#ffebee;border-color:#ef5350}.feedback{text-align:center;min-height:60px;font-size:18px;font-weight:900;line-height:1.6;margin-top:12px}.dots{display:flex;justify-content:center;gap:7px}.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#eee}.dot.ok{background:#c8e6c9}.dot.no{background:#ffcdd2}.actions{text-align:center;margin-top:15px}.footer{text-align:center;color:#78909c;font-weight:900}@media(max-width:650px){.levels,.answers{grid-template-columns:1fr}.q{font-size:30px}}</style></head><body><main class="app"><section class="box"><h1>√ 判斷平方根</h1><p style="text-align:center">先會看，再會判斷，最後自己化簡。</p><div class="levels"><button class="level on" data-level="1">① 判斷同類方根</button><button class="level" data-level="2">② 何為最簡根式</button><button class="level" data-level="3">③ 化簡根式</button></div></section><section class="box"><b id="lab"></b><div class="q" id="q"></div><div class="hint" id="hint"></div><div class="answers" id="answers" style="margin-top:15px"></div><div class="feedback" id="feedback"></div></section><section class="box"><div class="dots" id="dots"></div><p id="status" style="text-align:center"></p><div class="actions"><button class="next" id="next">下一題</button>　<a href="../../" target="_top">回遊戲入口</a></div><span id="total" hidden>0</span></section><p class="footer">[持續設計中...]</p></main><script>const $=x=>document.getElementById(x),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,S=[2,3,5,6,7,10,11,13,14,15,17,19],P=[4,9,16,25,36,49,64,81,100];let level=1,recent=[],total=0,cur,locked=false;function f(c,r){return(c===1?'':c===-1?'−':c)+'√'+r}function best(n){let z=1;P.forEach(x=>{if(n%x===0)z=x});return z}function render(){let h=$('dots');h.innerHTML='';for(let i=0;i<6;i++){let d=document.createElement('span');d.className='dot '+(i<recent.length?(recent[i]?'ok':'no'):'');d.textContent=i<recent.length?(recent[i]?'✓':'×'):'•';h.appendChild(d)}$('status').textContent='最近 '+recent.length+'/6 題｜答對 '+recent.filter(Boolean).length+' 題｜過關需 5 題';$('total').textContent=total}function choices(a){$('answers').innerHTML='';a.sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement('button');b.className='ans';b.textContent=v;b.onclick=()=>check(b,v);$('answers').appendChild(b)})}function newQ(){locked=false;$('next').disabled=true;$('feedback').textContent='請選擇答案。';if(level===1){let r1=S[R(0,S.length-1)],same=Math.random()<.5,pool=S.filter(x=>x!==r1),r2=same?r1:pool[R(0,pool.length-1)],a=R(1,6),b=R(1,6)*(Math.random()<.3?-1:1);cur={answer:same?'是同類方根':'不是同類方根',same,r1,r2};$('lab').textContent='第一關｜判斷同類方根';$('q').textContent=f(a,r1)+'　和　'+f(b,r2);$('hint').innerHTML='<b>只看根號裡！</b><br>比較 √'+r1+' 和 √'+r2+'，先不要管前面的係數。';choices(['是同類方根','不是同類方根'])}else if(level===2){let simple=Math.random()<.5,n;if(simple)n=S[R(0,S.length-1)];else{let k=S[R(0,S.length-1)],p=[4,9,16,25][R(0,3)];n=k*p}cur={answer:simple?'是最簡根式':'不是最簡根式',simple,n};$('lab').textContent='第二關｜何為最簡根式';$('q').textContent='√'+n;$('hint').innerHTML='<b>看根號裡的 '+n+'</b><br>還有沒有 <span class="square">大於 1 的完全平方數因數</span>？<br>例如：4、9、16、25……';choices(['是最簡根式','不是最簡根式'])}else{let inside=S[R(0,S.length-1)],root=R(2,8),n=root*root*inside,s=best(n),out=Math.sqrt(s),remain=n/s;cur={answer:f(out,remain),n,s,out,remain};$('lab').textContent='第三關｜化簡根式';$('q').textContent='√'+n+' ＝ ？';$('hint').innerHTML='<b>先找完全平方數因數</b><br>'+n+' ＝ <span class="square">'+s+'</span> × '+remain+'<br>√'+n+' ＝ √('+s+' × '+remain+')';let a=[cur.answer,f(out+1,remain),f(out,remain+1),'√'+remain];choices([...new Set(a)])}}function check(btn,v){if(locked)return;locked=true;total++;let ok=v===cur.answer;recent.push(ok);if(recent.length>6)recent.shift();[...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===cur.answer)b.classList.add('ok')});if(!ok)btn.classList.add('no');let tip;if(level===1)tip=cur.same?'根號內相同，所以是同類方根。':'根號內不同，所以不是同類方根。';else if(level===2)tip=cur.simple?'根號內沒有大於 1 的完全平方數因數，所以已是最簡根式。':cur.n+' 含有完全平方數因數 '+best(cur.n)+'，所以還能化簡。';else tip='√'+cur.n+' ＝ √'+cur.s+' × √'+cur.remain+' ＝ '+cur.answer+'。';$('feedback').textContent=(ok?'✅ 答對了！ ':'❌ 正確答案是 '+cur.answer+'。 ')+tip;render();$('next').disabled=false;if(recent.length===6&&recent.filter(Boolean).length>=5)$('feedback').textContent='🏆 本關過關！最近 6 題答對 '+recent.filter(Boolean).length+' 題。'}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;recent=[];document.querySelectorAll('[data-level]').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();newQ()});$('next').onclick=newQ;render();newQ();</script></body></html>
