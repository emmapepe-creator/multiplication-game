<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>完全平方數與正方形邊長</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:#f3f7ff;color:#263238;padding:18px}.app{max-width:850px;margin:auto}.hero,.card{background:#fff;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 6px 18px #455a6415}.hero{text-align:center}.hero h1{margin:4px;font-size:clamp(30px,6vw,48px)}.hero p{color:#607d8b;line-height:1.7}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab,.ans,.btn{border:2px solid #dfe7fd;border-radius:14px;background:#fff;padding:12px;font-weight:900;font-size:17px;cursor:pointer}.tab.active,.btn{background:#5b63c8;color:#fff;border-color:#5b63c8}.focus{background:#fff8dc;border:2px solid #f0d875;border-radius:16px;padding:14px;margin-top:14px;text-align:center;line-height:1.7}.question{text-align:center;font-size:clamp(32px,7vw,52px);font-weight:900;margin:22px 0}.hint{text-align:center;background:#eef3ff;border-radius:14px;padding:14px;font-weight:800;line-height:1.7}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.ans{min-height:72px;font-size:23px}.ans.ok{background:#e8f5e9;border-color:#43a047}.ans.no{background:#ffebee;border-color:#e53935}.feedback{min-height:58px;margin-top:14px;padding:13px;border-radius:14px;text-align:center;font-weight:900;line-height:1.6}.dots{display:flex;gap:8px;flex-wrap:wrap}.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid #dfe7fd;font-weight:900}.dot.ok{background:#e8f5e9;color:#2e7d32}.dot.no{background:#ffebee;color:#c62828}.actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}.small{color:#607d8b;font-size:14px}.square{width:120px;height:120px;border:5px solid #78909c;margin:15px auto;display:grid;place-items:center;background:#eef6ff;font-size:22px;font-weight:900}.hidden{display:none}@media(max-width:600px){.tabs{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.card{padding:16px}}
</style></head>
<body><main class="app">
<section class="hero"><div style="font-size:52px">⬜²</div><h1>完全平方數挑戰</h1><p>從完全平方數，連結到正方形面積與邊長，再練習估算。</p></section>
<section class="card"><div class="tabs"><button class="tab active" data-level="1">① 平方對應</button><button class="tab" data-level="2">② 面積 → 邊長</button><button class="tab" data-level="3">③ 估算邊長</button></div>
<div class="focus"><b>🎯 出題重點</b><br>1²～15²：<b>70%</b>　｜　16²～25²：<b>30%</b><br><span class="small">26²＝676、30²＝900 列為延伸重點提示。</span></div></section>
<section class="card"><div id="instruction" class="hint"></div><div id="squareBox"></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback">選一個答案看看。</div></section>
<section class="card"><b>最近 6 題</b><span id="score" class="small" style="float:right"></span><div id="dots" class="dots" style="margin-top:12px"></div><p class="small">最近 6 題答對至少 5 題即可過關。</p><div class="actions"><button id="next" class="btn">下一題</button><button id="reset" class="tab">重新開始</button><a class="tab" href="../../" style="text-decoration:none;color:inherit">← 回數學遊戲入口</a></div></section>
</main>
<script>
let level=1,recent=[],cur=null,locked=false;
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const weighted=()=>Math.random()<.7?R(1,15):R(16,25);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const q=document.getElementById('q'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),instruction=document.getElementById('instruction'),squareBox=document.getElementById('squareBox'),next=document.getElementById('next');
function renderDots(){let d=document.getElementById('dots');d.innerHTML='';for(let i=0;i<6;i++){let x=document.createElement('span');x.className='dot '+(i<recent.length?(recent[i]?'ok':'no'):'');x.textContent=i<recent.length?(recent[i]?'✓':'×'):'•';d.appendChild(x)}document.getElementById('score').textContent=recent.length+'/6｜答對 '+recent.filter(Boolean).length+' 題'}
function choices(vals){answers.innerHTML='';shuffle([...new Set(vals)]).slice(0,4).forEach(v=>{let b=document.createElement('button');b.className='ans';b.textContent=v;b.onclick=()=>check(b,v);answers.appendChild(b)})}
function newQ(){locked=false;next.disabled=true;feedback.textContent='選一個答案看看。';feedback.style.background='transparent';squareBox.innerHTML='';
if(level===1){let n=weighted(),a=n*n;cur={n,ans:String(a)};instruction.innerHTML='<b>視覺提示：</b> n² 就是 n × n。<br>先想「這個數乘自己是多少？」';q.textContent=n+'² ＝ ?';choices([a,(n+1)*(n+1),Math.max(1,(n-1)*(n-1)),a+n])}
if(level===2){let n=weighted(),a=n*n;cur={n,area:a,ans:String(n)};instruction.innerHTML='<b>正方形面積＝邊長 × 邊長＝邊長²</b><br>看到面積，反過來找哪一個數乘自己。';squareBox.innerHTML='<div class="square">面積<br>'+a+'</div>';q.textContent='邊長 ＝ ?';choices([n,Math.max(1,n-1),Math.min(25,n+1),Math.max(1,n-2)])}
if(level===3){let low=R(1,24),area=R(low*low+1,(low+1)*(low+1)-1),ans=low+' 和 '+(low+1)+' 之間';cur={low,high:low+1,area,ans};instruction.innerHTML='<b>找前後兩個完全平方數。</b><br>例如：14²＝196 ＜ 200 ＜ 225＝15²，所以邊長在 14 和 15 之間。';squareBox.innerHTML='<div class="square">面積<br>'+area+'</div>';q.textContent='邊長在哪兩個整數之間？';choices([ans,Math.max(1,low-1)+' 和 '+low+' 之間',(low+1)+' 和 '+(low+2)+' 之間',Math.max(1,low-2)+' 和 '+Math.max(2,low-1)+' 之間'])}}
function check(btn,v){if(locked)return;locked=true;let ok=String(v)===String(cur.ans);recent.push(ok);if(recent.length>6)recent.shift();[...answers.children].forEach(b=>{b.disabled=true;if(b.textContent===String(cur.ans))b.classList.add('ok')});if(!ok)btn.classList.add('no');
if(level===1)feedback.textContent=(ok?'✓ 答對！ ':'再看一次：')+cur.n+' × '+cur.n+'＝'+cur.n*cur.n+'。';
if(level===2)feedback.textContent=(ok?'✓ 答對！ ':'再想一下：')+cur.n+'²＝'+cur.area+'，所以邊長是 '+cur.n+'。';
if(level===3)feedback.textContent=(ok?'✓ 答對！ ':'再找一次：')+cur.low+'²＝'+cur.low*cur.low+' ＜ '+cur.area+' ＜ '+cur.high*cur.high+'＝'+cur.high+'²，所以邊長在 '+cur.low+' 和 '+cur.high+' 之間。';
feedback.style.background=ok?'#e8f5e9':'#ffebee';renderDots();next.disabled=false;if(recent.length===6&&recent.filter(Boolean).length>=5)feedback.textContent='🏆 過關！最近 6 題答對 '+recent.filter(Boolean).length+' 題。'}
document.querySelectorAll('.tab[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;recent=[];document.querySelectorAll('.tab[data-level]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderDots();newQ()});
next.onclick=newQ;document.getElementById('reset').onclick=()=>{recent=[];renderDots();newQ()};renderDots();newQ();
</script></body></html>
