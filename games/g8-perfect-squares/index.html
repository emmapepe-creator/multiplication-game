<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完全平方數與平方根</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:#f3f7ff;color:#263238;padding:18px}.app{max-width:900px;margin:auto}.hero,.card{background:#fff;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 6px 18px #455a6415}.hero{text-align:center}.hero h1{margin:4px;font-size:clamp(30px,6vw,48px)}.hero p{color:#607d8b;line-height:1.7}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.tab,.ans,.btn{border:2px solid #dfe7fd;border-radius:14px;background:#fff;padding:12px;font-weight:900;font-size:16px;cursor:pointer}.tab.active,.btn{background:#5b63c8;color:#fff;border-color:#5b63c8}.focus{background:#fff8dc;border:2px solid #f0d875;border-radius:16px;padding:14px;margin-top:14px;text-align:center;line-height:1.7}.question{text-align:center;font-size:clamp(30px,7vw,50px);font-weight:900;margin:22px 0}.hint{text-align:center;background:#eef3ff;border-radius:14px;padding:14px;font-weight:800;line-height:1.8}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.ans{min-height:72px;font-size:22px}.ans.ok{background:#e8f5e9;border-color:#43a047}.ans.no{background:#ffebee;border-color:#e53935}.feedback{min-height:58px;margin-top:14px;padding:13px;border-radius:14px;text-align:center;font-weight:900;line-height:1.7}.dots{display:flex;gap:8px;flex-wrap:wrap}.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid #dfe7fd;font-weight:900}.dot.ok{background:#e8f5e9;color:#2e7d32}.dot.no{background:#ffebee;color:#c62828}.actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}.small{color:#607d8b;font-size:14px}.square{width:125px;height:125px;border:5px solid #78909c;margin:15px auto;display:grid;place-items:center;background:#eef6ff;font-size:22px;font-weight:900;text-align:center}.flow{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin:14px auto;font-size:19px;font-weight:900}.flow span{border:2px solid #dfe7fd;border-radius:12px;padding:9px;background:#fff}.rootUnit{display:inline-block;border-radius:10px;background:#e9eefc;padding:4px 8px;margin:2px;font-weight:900}.footer-note{text-align:center;font-weight:900;color:#78909c;padding:12px;font-size:18px}@media(max-width:720px){.tabs{grid-template-columns:1fr 1fr}.answers{grid-template-columns:1fr}.card{padding:16px}.tab:last-child{grid-column:1/-1}}
</style></head><body><main class="app">
<section class="hero"><div style="font-size:52px">⬜² √</div><h1>完全平方數與平方根</h1><p>平方 → 面積與邊長 → 平方根 → 估算 → 同類方根加減</p></section>
<section class="card"><div class="tabs"><button class="tab active" data-level="1">① 平方對應</button><button class="tab" data-level="2">② 面積找邊長</button><button class="tab" data-level="3">③ 認識 √</button><button class="tab" data-level="4">④ 平方根估算</button><button class="tab" data-level="5">⑤ 同類方根加減</button></div><div id="focus" class="focus"></div></section>
<section class="card"><div id="instruction" class="hint"></div><div id="visual"></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite">選一個答案看看。</div></section>
<section class="card"><b>最近 6 題</b><span id="score" class="small" style="float:right"></span><div id="dots" class="dots" style="margin-top:12px"></div><p class="small">最近 6 題答對至少 5 題即可過關。</p><div class="actions"><button id="next" class="btn">下一題</button><button id="reset" class="tab">重新開始</button><a class="tab" href="../../" style="text-decoration:none;color:inherit">← 回數學遊戲入口</a></div></section>
<div class="footer-note">[持續設計中...]</div></main>
<script>
let level=1,recent=[],cur=null,locked=false;
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,weighted=()=>Math.random()<.7?R(1,15):R(16,25);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const q=document.getElementById('q'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),instruction=document.getElementById('instruction'),visual=document.getElementById('visual'),next=document.getElementById('next'),focus=document.getElementById('focus');
function renderDots(){let d=document.getElementById('dots');d.innerHTML='';for(let i=0;i<6;i++){let x=document.createElement('span');x.className='dot '+(i<recent.length?(recent[i]?'ok':'no'):'');x.textContent=i<recent.length?(recent[i]?'✓':'×'):'•';d.appendChild(x)}document.getElementById('score').textContent=recent.length+'/6｜答對 '+recent.filter(Boolean).length+' 題'}
function choices(vals){answers.innerHTML='';let a=[...new Set(vals.map(String))];while(a.length<4)a.push(''+R(1,30));shuffle(a).slice(0,4).forEach(v=>{let b=document.createElement('button');b.className='ans';b.textContent=v;b.addEventListener('click',()=>check(b,v));answers.appendChild(b)})}
function setFocus(){if(level<=2)focus.innerHTML='<b>🎯 完全平方數出題：</b>1²～15²占 70%｜16²～25²占 30%<br><span class="small">26²＝676、30²＝900 為延伸重點。</span>';else if(level===3)focus.innerHTML='<b>🔁 平方與平方根是「去、回」的關係</b><br>9²＝81　⇄　√81＝9';else if(level===4)focus.innerHTML='<b>📏 估算平方根：</b>先找前後兩個完全平方數。';else focus.innerHTML='<b>🧩 同類方根：</b>根號裡一樣 → 只算前面的係數 → 根號保留。'}
function newQ(){locked=false;next.disabled=true;feedback.textContent='選一個答案看看。';feedback.style.background='transparent';visual.innerHTML='';setFocus();
if(level===1){let n=weighted(),a=n*n;cur={n,ans:String(a)};instruction.innerHTML='<b>視覺提示：</b> n² 就是 n × n。';q.textContent=n+'² ＝ ?';choices([a,(n+1)*(n+1),Math.max(1,(n-1)*(n-1)),a+n])}
else if(level===2){let n=weighted(),a=n*n;cur={n,area:a,ans:String(n)};instruction.innerHTML='<b>正方形面積＝邊長²</b><br>哪一個數 × 自己會得到這個面積？';visual.innerHTML='<div class="square">面積<br>'+a+'</div>';q.textContent='邊長 ＝ ?';choices([n,Math.max(1,n-1),Math.min(25,n+1),Math.max(1,n-2)])}
else if(level===3){let n=weighted(),a=n*n;cur={n,area:a,ans:String(n)};instruction.innerHTML='<b>√ 是「找回邊長」的符號。</b><br>√'+a+' 的意思：哪一個正數平方後是 '+a+'？';visual.innerHTML='<div class="flow"><span>'+n+'²</span><b>→</b><span>'+a+'</span><b>→ √ 找回來 →</b><span>?</span></div>';q.textContent='√'+a+' ＝ ?';choices([n,Math.max(1,n-1),Math.min(25,n+1),Math.max(1,n-2)])}
else if(level===4){let low=R(1,24),area=R(low*low+1,(low+1)*(low+1)-1),ans=low+' 和 '+(low+1)+' 之間';cur={low,high:low+1,area,ans};instruction.innerHTML='<b>找 '+area+' 前後兩個完全平方數。</b><br>再判斷 √'+area+' 在哪兩個整數之間。';visual.innerHTML='<div class="flow"><span>'+low+'²＝'+low*low+'</span><b>＜</b><span>'+area+'</span><b>＜</b><span>'+(low+1)+'²＝'+(low+1)*(low+1)+'</span></div>';q.textContent='√'+area+' 在哪兩個整數之間？';choices([ans,Math.max(1,low-1)+' 和 '+low+' 之間',(low+1)+' 和 '+(low+2)+' 之間',Math.max(1,low-2)+' 和 '+Math.max(2,low-1)+' 之間'])}
else{let rad=[2,3,5,6,7,10][R(0,5)],mode=R(1,5),a,b,op,coef;if(mode===1){a=R(2,6);b=R(1,5);op='＋';coef=a+b}else if(mode===2){a=R(4,9);b=R(1,a-1);op='−';coef=a-b}else if(mode===3){a=1;b=R(2,5);op='＋';coef=a+b}else if(mode===4){a=R(1,4);b=R(a,6);op='−';coef=a-b}else{a=R(2,7);b=R(1,6);op=Math.random()<.5?'＋':'−';coef=op==='＋'?a+b:a-b}let fmt=c=>c===0?'0':(c===1?'√'+rad:c===-1?'−√'+rad:c+'√'+rad);let left=(a===1?'√'+rad:a+'√'+rad)+' '+op+' '+(b===1?'√'+rad:b+'√'+rad);cur={a,b,op,rad,coef,ans:fmt(coef)};instruction.innerHTML='<b>根號裡相同，就是同類方根。</b><br><span class="rootUnit">√'+rad+'</span>可以看成同一種單位，只加減前面的數字。';visual.innerHTML='<div class="flow"><span>'+left+'</span><b>→</b><span>('+a+(op==='＋'?'＋':'−')+b+')√'+rad+'</span></div>';q.textContent=left+' ＝ ?';let wrong1=fmt(op==='＋'?a+b+1:a-b+1),wrong2=fmt(op==='＋'?Math.abs(a-b):a+b);choices([cur.ans,wrong1,wrong2,(a+b)+'√'+(rad*2)])}}
function check(btn,v){if(locked)return;locked=true;let ok=String(v)===String(cur.ans);recent.push(ok);if(recent.length>6)recent.shift();[...answers.children].forEach(b=>{b.disabled=true;if(b.textContent===String(cur.ans))b.classList.add('ok')});if(!ok)btn.classList.add('no');
if(level===1)feedback.textContent=(ok?'✓ 答對！ ':'再看一次：')+cur.n+' × '+cur.n+'＝'+cur.n*cur.n+'。';
else if(level===2)feedback.textContent=(ok?'✓ 答對！ ':'再想一下：')+cur.n+'²＝'+cur.area+'，所以邊長是 '+cur.n+'。';
else if(level===3)feedback.textContent=(ok?'✓ 答對！ ':'再想一次：')+cur.n+'²＝'+cur.area+'，所以 √'+cur.area+'＝'+cur.n+'。';
else if(level===4)feedback.textContent=(ok?'✓ 答對！ ':'再找一次：')+cur.low+'²＝'+cur.low*cur.low+' ＜ '+cur.area+' ＜ '+cur.high*cur.high+'＝'+cur.high+'²，所以 '+cur.low+'＜√'+cur.area+'＜'+cur.high+'。';
else feedback.textContent=(ok?'✓ 答對！ ':'再看一次：')+'根號 √'+cur.rad+' 相同，只算係數：'+cur.a+(cur.op==='＋'?'＋':'−')+cur.b+'＝'+cur.coef+'，所以答案是 '+cur.ans+'。';
feedback.style.background=ok?'#e8f5e9':'#ffebee';renderDots();next.disabled=false;if(recent.length===6&&recent.filter(Boolean).length>=5)feedback.textContent='🏆 本關過關！最近 6 題答對 '+recent.filter(Boolean).length+' 題。'}
document.querySelectorAll('.tab[data-level]').forEach(b=>b.addEventListener('click',()=>{level=+b.dataset.level;recent=[];document.querySelectorAll('.tab[data-level]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderDots();newQ()}));
next.addEventListener('click',newQ);document.getElementById('reset').addEventListener('click',()=>{recent=[];renderDots();newQ()});renderDots();newQ();
</script></body></html>
