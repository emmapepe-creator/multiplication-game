<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國一數學｜正負數相加</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:linear-gradient(#eef7ff,#fff8e8);color:#263238;padding:18px;min-height:100vh}.app{max-width:920px;margin:auto;background:#fff;border-radius:28px;padding:24px;box-shadow:0 14px 35px #455a6422}h1{text-align:center;font-size:clamp(30px,5vw,48px);margin:4px}.sub,.status{text-align:center;color:#607d8b}.rule{background:#eef6ff;border-radius:18px;padding:17px;text-align:center;font-size:20px;line-height:1.8;margin:18px 0}.cards,.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card,.ans{background:#fff;border:3px solid #dbe9f7;border-radius:20px;padding:18px;font-weight:900;cursor:pointer}.card{text-align:left}.card b{display:block;font-size:23px;margin:8px 0}.card span{color:#607d8b;line-height:1.5}.emoji{font-size:38px}.screen{display:none}.screen.on{display:block}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.pill{background:#f1f3f4;border-radius:999px;padding:9px 14px;font-weight:800}.prompt{text-align:center;font-size:20px;font-weight:900;margin-top:22px}.q{text-align:center;font-size:clamp(30px,7vw,52px);font-weight:900;margin:16px 0}.visual{background:#f7f9fb;border-radius:20px;padding:16px;margin:12px auto 20px;max-width:760px}.visual-title{text-align:center;font-weight:900;margin-bottom:10px}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:52px}.chip{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:900;border:3px solid}.pos{background:#e3f2fd;border-color:#42a5f5;color:#1565c0}.neg{background:#ffebee;border-color:#ef5350;color:#c62828}.pair{opacity:.22;text-decoration:line-through}.visual-note{text-align:center;font-size:17px;font-weight:800;margin-top:10px;color:#546e7a}.answers{margin-top:12px}.ans{font-size:clamp(22px,4vw,32px);min-height:86px}.ans.ok{background:#e8f5e9;border-color:#66bb6a;color:#2e7d32}.ans.no{background:#ffebee;border-color:#ef9a9a;color:#c62828}.feedback{text-align:center;min-height:62px;font-size:20px;font-weight:900;line-height:1.5;margin-top:14px}.history{display:flex;justify-content:center;gap:8px;margin:14px}.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#eceff1;font-weight:900}.dot.ok{background:#c8e6c9;color:#2e7d32}.dot.no{background:#ffcdd2;color:#c62828}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}.primary,.secondary{border:0;border-radius:15px;padding:13px 20px;font-size:18px;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:#4b74b9;color:#fff}.secondary{background:#eceff1;color:#263238}.result{text-align:center;padding:28px}.t{font-size:78px}@media(max-width:600px){.cards,.answers{grid-template-columns:1fr}.app{padding:16px}.chip{width:38px;height:38px;font-size:22px}}</style></head><body><main class="app"><h1>➕ 正負數相加</h1><p class="sub">國一數學｜用正負籌碼看懂「同號相加」和「異號抵銷」。</p><section id="menu" class="screen on"><div class="rule"><b>＋1</b> 和 <b>−1</b> 放在一起會抵銷，合起來是 <b>0</b>。<br>先看籌碼，再算答案，不急著背口訣。</div><div class="cards"><button class="card" data-level="1"><div class="emoji">🔵＋🔵</div><b>第一關｜正數＋正數</b><span>兩組正籌碼合在一起，數一數共有多少個＋。</span></button><button class="card" data-level="2"><div class="emoji">🔴＋🔴</div><b>第二關｜負數＋負數</b><span>兩組負籌碼合在一起，數一數共有多少個−。</span></button><button class="card" data-level="3"><div class="emoji">🔵⚡🔴</div><b>第三關｜正數＋負數</b><span>一個＋和一個−配成一對抵銷，看最後剩下什麼。</span></button><button class="card" data-level="4"><div class="emoji">🔴⚡🔵</div><b>第四關｜負數＋正數</b><span>交換出現順序也一樣：先配對抵銷，再看剩下的籌碼。</span></button></div><p class="status">最近 6 題答對至少 5 題即可過關。</p><div class="actions"><a class="secondary" href="../../" target="_top">← 回數學遊戲入口</a></div></section><section id="game" class="screen"><div class="top"><span class="pill" id="lab"></span><span class="pill">總答題 <span id="total">0</span> 題</span></div><div class="prompt">看正負籌碼，算出答案。</div><div class="q" id="q"></div><div class="visual"><div class="visual-title" id="vtitle"></div><div class="chips" id="chips"></div><div class="visual-note" id="vnote"></div></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="history" id="history"></div><div class="status" id="status"></div><div class="actions"><button class="primary" id="next" hidden>下一題</button><button class="secondary" id="back">回到選關</button></div></section><section id="result" class="screen"><div class="result"><div class="t">🏆</div><h2 id="rt"></h2><p id="sum"></p><div class="actions"><button class="primary" id="again">再挑戰一次</button><button class="secondary" id="choose">選其他關卡</button><a class="secondary" href="../../" target="_top">回數學遊戲入口</a></div></div></section></main><script>const $=x=>document.getElementById(x),labs=['','第一關｜正數＋正數','第二關｜負數＋負數','第三關｜正數＋負數','第四關｜負數＋正數'];let level=1,recent=[],total=0,correct=0,cur,locked=false;const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,fmt=n=>n>0?'＋'+n:n<0?'−'+Math.abs(n):'0';function show(x){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));$(x).classList.add('on')}function start(n){level=n;recent=[];total=correct=0;$('lab').textContent=labs[n];show('game');render();newQ()}function make(){let a,b;if(level===1){a=R(1,8);b=R(1,8)}if(level===2){a=-R(1,8);b=-R(1,8)}if(level===3){a=R(2,9);b=-R(1,9)}if(level===4){a=-R(2,9);b=R(1,9)}return{a,b,answer:a+b}}function chip(sign,paired=false){let s=document.createElement('span');s.className='chip '+(sign>0?'pos':'neg')+(paired?' pair':'');s.textContent=sign>0?'+':'−';return s}function visual(c,after=false){let box=$('chips');box.innerHTML='';let pa=Math.abs(c.a),pb=Math.abs(c.b),mixed=c.a*c.b<0,pairs=mixed?Math.min(pa,pb):0;if(!after){for(let i=0;i<pa;i++)box.appendChild(chip(Math.sign(c.a)));for(let i=0;i<pb;i++)box.appendChild(chip(Math.sign(c.b)));$('vtitle').textContent=mixed?'先找找看：哪些＋和−可以配成一對？':'把兩組同號籌碼合在一起';$('vnote').textContent=mixed?'每一組「＋1、−1」會抵銷成 0。':'同號不用抵銷，直接合併數量。'}else{for(let i=0;i<pairs;i++){box.appendChild(chip(1,true));box.appendChild(chip(-1,true))}let left=Math.abs(c.answer);for(let i=0;i<left;i++)box.appendChild(chip(Math.sign(c.answer)));$('vtitle').textContent=mixed?pairs+' 對正負籌碼抵銷後':'合併後';$('vnote').textContent=c.answer===0?'全部剛好抵銷，所以答案是 0。':'最後剩下 '+left+' 個「'+(c.answer>0?'＋':'−')+'」，所以答案是 '+fmt(c.answer)+'。'}}function newQ(){locked=false;$('next').hidden=true;$('feedback').textContent='';cur=make();$('q').textContent='('+fmt(cur.a)+') ＋ ('+fmt(cur.b)+') ＝ ？';visual(cur,false);let opts=[cur.answer,-cur.answer,cur.a-cur.b,cur.answer+(Math.random()<.5?1:-1)];opts=[...new Set(opts)];while(opts.length<4){let z=R(-16,16);if(!opts.includes(z))opts.push(z)}let box=$('answers');box.innerHTML='';opts.slice(0,4).sort(()=>Math.random()-.5).forEach(n=>{let b=document.createElement('button');b.className='ans';b.textContent=fmt(n);b.onclick=()=>check(b,n);box.appendChild(b)})}function check(btn,n){if(locked)return;locked=true;total++;let ok=n===cur.answer;if(ok)correct++;recent.push(ok);if(recent.length>6)recent.shift();[...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===fmt(cur.answer))b.classList.add('ok')});if(!ok)btn.classList.add('no');visual(cur,true);let mixed=cur.a*cur.b<0,tip=mixed?'異號相加：＋1 和 −1 一對一抵銷，再看剩下哪一種籌碼。':'同號相加：把籌碼合在一起，符號保持不變。';$('feedback').textContent=(ok?'✅ 答對了！ ':'❌ 正確答案是 '+fmt(cur.answer)+'。 ')+tip;$('feedback').style.color=ok?'#2e7d32':'#c62828';render();if(recent.length===6&&recent.filter(Boolean).length>=5)setTimeout(pass,600);else $('next').hidden=false}function render(){$('total').textContent=total;let h=$('history');h.innerHTML='';for(let i=0;i<6;i++){let d=document.createElement('span');d.className='dot';if(i<recent.length){d.textContent=recent[i]?'✓':'×';d.classList.add(recent[i]?'ok':'no')}else d.textContent='•';h.appendChild(d)}$('status').textContent='最近 '+recent.length+'/6 題｜答對 '+recent.filter(Boolean).length+' 題｜過關需 5 題'}function pass(){$('rt').textContent=labs[level]+' 過關！';$('sum').textContent='共作答 '+total+' 題，答對 '+correct+' 題。';show('result')}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));$('next').onclick=newQ;$('back').onclick=$('choose').onclick=()=>show('menu');$('again').onclick=()=>start(level);</script></body></html>
