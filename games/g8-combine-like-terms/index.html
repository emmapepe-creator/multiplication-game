<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國二數學｜合併同類項</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:linear-gradient(#eef7ff,#fff8e6);color:#263238;padding:18px;min-height:100vh}.app{max-width:900px;margin:auto;background:#fff;border-radius:28px;padding:24px;box-shadow:0 14px 35px #455a6422}h1{text-align:center;font-size:clamp(30px,5vw,48px);margin:4px}.sub,.status{text-align:center;color:#607d8b}.rule{background:#eef1ff;border-radius:18px;padding:17px;text-align:center;font-size:20px;line-height:1.7;margin:18px 0}.rule b{color:#4b53b7}.cards,.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card,.ans{background:#fff;border:3px solid #dfe7fd;border-radius:20px;padding:18px;font-weight:900;cursor:pointer}.card{text-align:left}.card b{display:block;font-size:23px;margin:8px 0}.card span{color:#607d8b;line-height:1.5}.emoji{font-size:38px}.screen{display:none}.screen.on{display:block}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.pill{background:#f1f3f4;border-radius:999px;padding:9px 14px;font-weight:800}.prompt{text-align:center;font-size:20px;font-weight:900;margin-top:22px}.q{text-align:center;font-size:clamp(34px,7vw,58px);font-weight:900;margin:16px 0 24px}.ans{font-size:clamp(22px,4vw,31px);min-height:96px}.ans.ok{background:#e8f5e9;border-color:#66bb6a;color:#2e7d32}.ans.no{background:#ffebee;border-color:#ef9a9a;color:#c62828}.feedback{text-align:center;min-height:62px;font-size:20px;font-weight:900;line-height:1.5;margin-top:14px}.history{display:flex;justify-content:center;gap:8px;margin:14px}.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#eceff1;font-weight:900}.dot.ok{background:#c8e6c9;color:#2e7d32}.dot.no{background:#ffcdd2;color:#c62828}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}.primary,.secondary{border:0;border-radius:15px;padding:13px 20px;font-size:18px;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:#5b63c8;color:#fff}.secondary{background:#eceff1;color:#263238}.result{text-align:center;padding:28px}.t{font-size:78px}@media(max-width:600px){.cards,.answers{grid-template-columns:1fr}.app{padding:16px}}</style></head><body><main class="app"><h1>➕ 合併同類項</h1><p class="sub">國二數學｜先確認是同類項，再把前面的係數相加減。</p><section id="menu" class="screen on"><div class="rule"><b>3x ＋ 5x ＝ (3＋5)x ＝ 8x</b><br>文字部分保留，合併的是「係數」。</div><div class="cards"><button class="card" data-level="1"><div class="emoji">🌱</div><b>第一關｜正數係數</b><span>例如 3x＋5x，先熟悉係數相加。</span></button><button class="card" data-level="2"><div class="emoji">➖</div><b>第二關｜加減混合</b><span>例如 7x−3x，練習係數相減。</span></button><button class="card" data-level="3"><div class="emoji">🔍</div><b>第三關｜多個同類項</b><span>三個同類項連續合併。</span></button><button class="card" data-level="4"><div class="emoji">🏆</div><b>第四關｜綜合挑戰</b><span>x、y、x² 隨機出題，正負號混合。</span></button></div><p class="status">最近 6 題答對至少 5 題即可過關。</p><div class="actions"><a class="secondary" href="../../">← 回數學遊戲入口</a></div></section><section id="game" class="screen"><div class="top"><span class="pill" id="lab"></span><span class="pill">總答題 <span id="total">0</span> 題</span></div><div class="prompt">合併同類項後，答案是哪一個？</div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="history" id="history"></div><div class="status" id="status"></div><div class="actions"><button class="primary" id="next" hidden>下一題</button><button class="secondary" id="back">回到選關</button></div></section><section id="result" class="screen"><div class="result"><div class="t">🏆</div><h2 id="rt"></h2><p id="sum"></p><div class="actions"><button class="primary" id="again">再挑戰一次</button><button class="secondary" id="choose">選其他關卡</button><a class="secondary" href="../../">回數學遊戲入口</a></div></div></section></main><script>const $=x=>document.getElementById(x),labs=['','第一關｜正數係數','第二關｜加減混合','第三關｜多個同類項','第四關｜綜合挑戰'];let level=1,recent=[],total=0,correct=0,cur,locked=false;const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function show(x){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));$(x).classList.add('on')}function fmt(c,v){if(c===0)return'0';if(c===1)return v;if(c===-1)return'−'+v;return(c<0?'−'+Math.abs(c):c)+v}function expr(cs,v){return cs.map((c,i)=>{let t=fmt(Math.abs(c),v);if(i===0)return c<0?'−'+t:t;return(c<0?' − ':' ＋ ')+t}).join('')}function start(n){level=n;recent=[];total=correct=0;$('lab').textContent=labs[n];show('game');render();newQ()}function newQ(){locked=false;$('next').hidden=true;$('feedback').textContent='';let v=level===4?['x','y','x²'][R(0,2)]:'x',cs;if(level===1)cs=[R(1,9),R(1,9)];else if(level===2){cs=[R(2,9),-R(1,8)];if(cs[0]+cs[1]===0)cs[1]++}else if(level===3)cs=[R(1,7),R(1,7),-R(1,6)];else{cs=[R(-8,9)||2,R(-8,9)||-3,R(-6,7)||1];if(cs.reduce((a,b)=>a+b,0)===0)cs[2]++}let s=cs.reduce((a,b)=>a+b,0),answer=fmt(s,v);cur={v,cs,s,answer};$('q').textContent=expr(cs,v);let vals=new Set([s,s+1,s-1,cs[0]+cs[1],Math.abs(s)]);let opts=[...vals].filter((x,i,a)=>a.indexOf(x)===i).slice(0,4);while(opts.length<4){let z=s+R(-5,5);if(!opts.includes(z))opts.push(z)}let box=$('answers');box.innerHTML='';opts.sort(()=>Math.random()-.5).forEach(z=>{let b=document.createElement('button');b.className='ans';b.textContent=fmt(z,v);b.onclick=()=>check(b,z);box.appendChild(b)})}function check(btn,z){if(locked)return;locked=true;total++;let ok=z===cur.s;if(ok)correct++;recent.push(ok);if(recent.length>6)recent.shift();[...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===cur.answer)b.classList.add('ok')});if(!ok)btn.classList.add('no');$('feedback').textContent=ok?`✅ 答對了！係數合併後是 ${cur.s}，文字 ${cur.v} 保留。`:`❌ 先算係數：${cur.cs.join('、')}，文字 ${cur.v} 不變，答案是 ${cur.answer}。`;$('feedback').style.color=ok?'#2e7d32':'#c62828';render();if(recent.length===6&&recent.filter(Boolean).length>=5)setTimeout(pass,600);else $('next').hidden=false}function render(){$('total').textContent=total;let h=$('history');h.innerHTML='';for(let i=0;i<6;i++){let d=document.createElement('span');d.className='dot';if(i<recent.length){d.textContent=recent[i]?'✓':'×';d.classList.add(recent[i]?'ok':'no')}else d.textContent='•';h.appendChild(d)}$('status').textContent=`最近 ${recent.length}/6 題｜答對 ${recent.filter(Boolean).length} 題｜過關需 5 題`}function pass(){$('rt').textContent=labs[level]+' 過關！';$('sum').textContent=`共作答 ${total} 題，答對 ${correct} 題。`;show('result')}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));$('next').onclick=newQ;$('back').onclick=$('choose').onclick=()=>show('menu');$('again').onclick=()=>start(level);</script></body></html>
