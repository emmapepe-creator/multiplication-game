<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國二數學｜多項式加減</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:linear-gradient(#edf8f4,#fff8e8);color:#263238;padding:18px;min-height:100vh}.app{max-width:920px;margin:auto;background:#fff;border-radius:28px;padding:24px;box-shadow:0 14px 35px #455a6422}h1{text-align:center;font-size:clamp(30px,5vw,48px);margin:4px}.sub,.status{text-align:center;color:#607d8b}.rule{background:#eaf7f1;border-radius:18px;padding:17px;text-align:center;font-size:20px;line-height:1.8;margin:18px 0}.rule b{color:#287b62}.cards,.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card,.ans{background:#fff;border:3px solid #d8eee7;border-radius:20px;padding:18px;font-weight:900;cursor:pointer}.card{text-align:left}.card b{display:block;font-size:23px;margin:8px 0}.card span{color:#607d8b;line-height:1.5}.emoji{font-size:38px}.screen{display:none}.screen.on{display:block}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.pill{background:#f1f3f4;border-radius:999px;padding:9px 14px;font-weight:800}.prompt{text-align:center;font-size:20px;font-weight:900;margin-top:22px}.q{text-align:center;font-size:clamp(26px,6vw,45px);font-weight:900;margin:16px 0 24px;line-height:1.5}.ans{font-size:clamp(18px,3.5vw,27px);min-height:96px}.ans.ok{background:#e8f5e9;border-color:#66bb6a;color:#2e7d32}.ans.no{background:#ffebee;border-color:#ef9a9a;color:#c62828}.feedback{text-align:center;min-height:62px;font-size:20px;font-weight:900;line-height:1.5;margin-top:14px}.history{display:flex;justify-content:center;gap:8px;margin:14px}.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#eceff1;font-weight:900}.dot.ok{background:#c8e6c9;color:#2e7d32}.dot.no{background:#ffcdd2;color:#c62828}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}.primary,.secondary{border:0;border-radius:15px;padding:13px 20px;font-size:18px;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:#33856b;color:#fff}.secondary{background:#eceff1;color:#263238}.result{text-align:center;padding:28px}.t{font-size:78px}@media(max-width:600px){.cards,.answers{grid-template-columns:1fr}.app{padding:16px}}</style></head><body><main class="app"><h1>🧮 多項式加減</h1><p class="sub">國二數學｜先去括號，再把相同次方的同類項放在一起計算。</p><section id="menu" class="screen on"><div class="rule"><b>(2x＋3) ＋ (4x−1) ＝ 6x＋2</b><br>先看括號前的符號，再依照同類項分組計算。</div><div class="cards"><button class="card" data-level="1"><div class="emoji">🌱</div><b>第一關｜一次式相加</b><span>兩個一次式相加，練習 x 項與常數項分開合併。</span></button><button class="card" data-level="2"><div class="emoji">➖</div><b>第二關｜一次式相減</b><span>第二個括號前是減號，先變號再合併。</span></button><button class="card" data-level="3"><div class="emoji">🔍</div><b>第三關｜二次式加減</b><span>x²、x、常數三種項分別合併。</span></button><button class="card" data-level="4"><div class="emoji">🏆</div><b>第四關｜綜合挑戰</b><span>一次式與二次式、加法與減法隨機出題。</span></button></div><p class="status">最近 6 題答對至少 5 題即可過關。</p><div class="actions"><a class="secondary" href="../../">← 回數學遊戲入口</a></div></section><section id="game" class="screen"><div class="top"><span class="pill" id="lab"></span><span class="pill">總答題 <span id="total">0</span> 題</span></div><div class="prompt">計算後，哪一個答案正確？</div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="history" id="history"></div><div class="status" id="status"></div><div class="actions"><button class="primary" id="next" hidden>下一題</button><button class="secondary" id="back">回到選關</button></div></section><section id="result" class="screen"><div class="result"><div class="t">🏆</div><h2 id="rt"></h2><p id="sum"></p><div class="actions"><button class="primary" id="again">再挑戰一次</button><button class="secondary" id="choose">選其他關卡</button><a class="secondary" href="../../">回數學遊戲入口</a></div></div></section></main><script>const $=x=>document.getElementById(x),labs=['','第一關｜一次式相加','第二關｜一次式相減','第三關｜二次式加減','第四關｜綜合挑戰'];let level=1,recent=[],total=0,correct=0,cur,locked=false;const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function show(x){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));$(x).classList.add('on')}function term(c,v,first=false){if(c===0)return'';let core=(Math.abs(c)===1?v:Math.abs(c)+v);if(first)return(c<0?'−':'')+core;return(c<0?' − ':' ＋ ')+core}function poly(a,b,c,quad=true){let out='';if(quad&&a!==0)out=term(a,'x²',true);if(b!==0)out+=term(b,'x',out==='');if(c!==0)out+=term(c,'',out==='');return out||'0'}function start(n){level=n;recent=[];total=correct=0;$('lab').textContent=labs[n];show('game');render();newQ()}function newQ(){locked=false;$('next').hidden=true;$('feedback').textContent='';let quad=level===3||(level===4&&Math.random()<.6),sub=level===2||(level>=3&&Math.random()<.5);let a1=quad?R(1,5):0,b1=R(-6,7)||2,c1=R(-8,8),a2=quad?R(-4,5)||2:0,b2=R(-6,7)||-3,c2=R(-8,8);let A=a1+(sub?-a2:a2),B=b1+(sub?-b2:b2),C=c1+(sub?-c2:c2);let p1=poly(a1,b1,c1,quad),p2=poly(a2,b2,c2,quad),answer=poly(A,B,C,quad);cur={A,B,C,answer,sub,quad};$('q').textContent=`( ${p1} ) ${sub?'−':'＋'} ( ${p2} )`;let opts=[answer,poly(A,B,-C,quad),poly(A,-B,C,quad),poly(a1+a2,b1+b2,c1+c2,quad)];opts=[...new Set(opts)];while(opts.length<4){let z=poly(A,B+(R(1,3)),C,quad);if(!opts.includes(z))opts.push(z)}let box=$('answers');box.innerHTML='';opts.slice(0,4).sort(()=>Math.random()-.5).forEach(t=>{let x=document.createElement('button');x.className='ans';x.textContent=t;x.onclick=()=>check(x,t);box.appendChild(x)})}function check(btn,t){if(locked)return;locked=true;total++;let ok=t===cur.answer;if(ok)correct++;recent.push(ok);if(recent.length>6)recent.shift();[...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===cur.answer)b.classList.add('ok')});if(!ok)btn.classList.add('no');let tip=cur.sub?'先把第二個括號內每一項變號，再分別合併 x²、x、常數項。':'把相同次方的項分別合併。';$('feedback').textContent=(ok?'✅ 答對了！ ':'❌ 正確答案是 '+cur.answer+'。 ')+tip;$('feedback').style.color=ok?'#2e7d32':'#c62828';render();if(recent.length===6&&recent.filter(Boolean).length>=5)setTimeout(pass,600);else $('next').hidden=false}function render(){$('total').textContent=total;let h=$('history');h.innerHTML='';for(let i=0;i<6;i++){let d=document.createElement('span');d.className='dot';if(i<recent.length){d.textContent=recent[i]?'✓':'×';d.classList.add(recent[i]?'ok':'no')}else d.textContent='•';h.appendChild(d)}$('status').textContent=`最近 ${recent.length}/6 題｜答對 ${recent.filter(Boolean).length} 題｜過關需 5 題`}function pass(){$('rt').textContent=labs[level]+' 過關！';$('sum').textContent=`共作答 ${total} 題，答對 ${correct} 題。`;show('result')}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));$('next').onclick=newQ;$('back').onclick=$('choose').onclick=()=>show('menu');$('again').onclick=()=>start(level);</script></body></html>
