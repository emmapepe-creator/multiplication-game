<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九九乘法分級挑戰</title>
<style>:root{--ink:#263238;--purple:#5b63c8}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;color:var(--ink);background:linear-gradient(180deg,#eef7ff,#fff7df);min-height:100vh;padding:18px}.app{max-width:940px;margin:auto;background:#fff;border-radius:28px;padding:24px;box-shadow:0 14px 35px #455a6422}h1{text-align:center;margin:0 0 8px;font-size:clamp(30px,5vw,50px)}.subtitle{text-align:center;color:#607d8b;font-size:18px;margin-bottom:20px}.screen{display:none}.screen.active{display:block}.namebox{max-width:520px;margin:25px auto;text-align:center}input{width:100%;font-size:24px;padding:14px 16px;border:3px solid #c5cae9;border-radius:16px;text-align:center}.primary{border:0;background:var(--purple);color:white;font-size:21px;font-weight:900;padding:14px 24px;border-radius:16px;cursor:pointer;margin-top:16px}.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.level{border:0;border-radius:22px;padding:20px 14px;background:#fff;box-shadow:0 6px 18px #455a6422;cursor:pointer;text-align:left}.level strong{font-size:24px;display:block;margin-bottom:7px}.level span{font-size:16px;color:#607d8b}.level .badge{font-size:35px;margin-bottom:8px}.topbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pill{background:#f1f3f4;border-radius:999px;padding:9px 14px;font-weight:800}.question{border:4px solid #dfe7fd;border-radius:24px;padding:26px;text-align:center;font-size:clamp(48px,9vw,90px);font-weight:900;margin:12px 0 20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:15px}.choice{border:0;border-radius:22px;min-height:145px;background:#fff;box-shadow:0 6px 17px #455a6422;cursor:pointer;font:inherit}.choice .icon{font-size:44px}.choice .num{font-size:clamp(36px,6vw,58px);font-weight:900}.choice.correct{background:#e8f5e9;outline:4px solid #81c784}.choice.wrong{background:#ffebee;outline:4px solid #ef9a9a}.feedback{text-align:center;min-height:54px;font-size:28px;font-weight:900;margin-top:14px}.historybox{background:#f8fafc;border-radius:18px;padding:12px;margin-top:10px;text-align:center}.history{display:flex;justify-content:center;gap:9px;margin-top:8px}.dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#eceff1;font-weight:900;font-size:20px}.good{background:#c8e6c9;color:#1b5e20}.bad{background:#ffcdd2;color:#b71c1c}.result{text-align:center;padding:20px}.trophy{font-size:90px}.result h2{font-size:40px;margin:8px}.report{max-width:560px;margin:20px auto;background:#f7f9fc;border-radius:20px;padding:20px;font-size:20px;line-height:1.9;text-align:left}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.secondary{border:0;background:#eceff1;font-size:18px;font-weight:800;padding:12px 18px;border-radius:14px;cursor:pointer}.smallnote{text-align:center;color:#78909c;margin-top:15px}@media(max-width:600px){.app{padding:16px}.choices{gap:10px}.choice{min-height:125px}}</style>
</head><body><div class="app"><h1>🚀 九九乘法分級挑戰</h1><div class="subtitle">每一關：最近 6 題中答對至少 5 題，就算過關！</div>
<section id="start" class="screen active"><div class="namebox"><h2>👤 先輸入你的名字</h2><input id="studentName" maxlength="12" placeholder="例如：小宇"><button class="primary" onclick="goLevels()">開始挑戰</button></div></section>
<section id="levelScreen" class="screen"><h2 id="hello" style="text-align:center"></h2><div class="levels"><button class="level" onclick="startLevel(1)"><div class="badge">🌱</div><strong>第一關｜2、5 倍</strong><span>先從規律比較明顯的乘法開始。</span></button><button class="level" onclick="startLevel(2)"><div class="badge">🐣</div><strong>第二關｜3、4 倍</strong><span>練習常見的基礎乘法。</span></button><button class="level" onclick="startLevel(3)"><div class="badge">🚗</div><strong>第三關｜6、7 倍</strong><span>進入比較需要熟練度的題目。</span></button><button class="level" onclick="startLevel(4)"><div class="badge">🚀</div><strong>第四關｜8、9 倍</strong><span>挑戰九九乘法後半段。</span></button><button class="level" onclick="startLevel(5)"><div class="badge">🏆</div><strong>第五關｜全部九九乘法</strong><span>1～9 綜合隨機挑戰。</span></button></div><div class="smallnote">可以依照學生能力直接選擇適合的關卡。</div></section>
<section id="game" class="screen"><div class="topbar"><div class="pill" id="who"></div><div class="pill" id="levelLabel"></div><div class="pill">總答題 <span id="total">0</span> 題</div></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="historybox"><b>最近 6 題</b><div class="history" id="history"></div></div></section>
<section id="result" class="screen"><div class="result"><div class="trophy">🏆</div><h2>挑戰成功！</h2><div id="congrats" style="font-size:22px"></div><div class="report" id="report"></div><div class="actions"><button class="primary" onclick="sameLevel()">再挑戰一次</button><button class="secondary" onclick="showLevels()">選擇其他關卡</button></div><div class="smallnote">📸 可以把這個過關畫面拿給老師看！</div></div></section></div>
<script>const icons=["🍎","⭐","🐼","⚽","🎈","🐳","🍀","🚙","🌈","🦖","🎯","🚀"];const configs={1:{factors:[2,5],name:"第一關｜2、5 倍乘法"},2:{factors:[3,4],name:"第二關｜3、4 倍乘法"},3:{factors:[6,7],name:"第三關｜6、7 倍乘法"},4:{factors:[8,9],name:"第四關｜8、9 倍乘法"},5:{factors:[1,2,3,4,5,6,7,8,9],name:"第五關｜完整九九乘法"}};let student="",level=1,answer=0,recent=[],total=0,correctTotal=0,locked=false;function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active")}function goLevels(){student=document.getElementById("studentName").value.trim()||"同學";document.getElementById("hello").textContent=`${student}，選一個關卡開始吧！`;show("levelScreen")}function showLevels(){document.getElementById("hello").textContent=`${student}，選一個關卡開始吧！`;show("levelScreen")}function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function startLevel(n){level=n;recent=[];total=0;correctTotal=0;document.getElementById("who").textContent=`👤 ${student}`;document.getElementById("levelLabel").textContent=configs[level].name;show("game");update();newQ()}function sameLevel(){startLevel(level)}function distract(a,b,ans){let s=new Set([ans]);let c=[ans+a,ans-a,ans+b,ans-b,ans+1,ans-1,ans+2,ans-2,a*rand(1,9),b*rand(1,9),rand(1,9)*rand(1,9)].filter(x=>x>0&&x<=81&&x!==ans);shuffle(c).forEach(x=>{if(s.size<4)s.add(x)});while(s.size<4){let x=rand(1,81);if(x!==ans)s.add(x)}return shuffle([...s])}function newQ(){locked=false;document.getElementById("feedback").textContent="";let fs=configs[level].factors,a=fs[rand(0,fs.length-1)],b=rand(1,9);if(Math.random()<.5){let t=a;a=b;b=t}answer=a*b;document.getElementById("question").textContent=`${a} × ${b} = ?`;let opts=distract(a,b,answer),ics=shuffle([...icons]).slice(0,4),box=document.getElementById("choices");box.innerHTML="";opts.forEach((v,i)=>{let bt=document.createElement("button");bt.className="choice";bt.innerHTML=`<div class="icon">${ics[i]}</div><div class="num">${v}</div>`;bt.onclick=()=>check(v,bt);box.appendChild(bt)})}function check(v,bt){if(locked)return;locked=true;total++;let ok=v===answer;if(ok)correctTotal++;recent.push(ok);if(recent.length>6)recent.shift();document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(+b.querySelector(".num").textContent===answer)b.classList.add("correct")});let f=document.getElementById("feedback");if(ok){f.textContent="✅ 答對了！";f.style.color="#2e7d32"}else{bt.classList.add("wrong");f.textContent=`❌ 正確答案是 ${answer}`;f.style.color="#c62828"}update();if(recent.length===6&&recent.filter(Boolean).length>=5)setTimeout(pass,700);else setTimeout(newQ,850)}function update(){document.getElementById("total").textContent=total;let h=document.getElementById("history");h.innerHTML="";for(let i=0;i<6;i++){let d=document.createElement("div");d.className="dot";if(i<recent.length){d.textContent=recent[i]?"✓":"✕";d.classList.add(recent[i]?"good":"bad")}else d.textContent="•";h.appendChild(d)}}function pass(){let pct=total?Math.round(correctTotal/total*100):0;document.getElementById("congrats").textContent=`${student}，你通過了 ${configs[level].name}！`;document.getElementById("report").innerHTML=`<b>九九乘法挑戰紀錄</b><br>👤 學生：${student}<br>🎯 通過關卡：${configs[level].name}<br>📝 本次答題：${total} 題<br>✅ 答對：${correctTotal} 題<br>📊 正確率：${pct}%<br>⭐ 過關條件：最近 6 題答對至少 5 題`;show("result")}update();</script></body></html>
