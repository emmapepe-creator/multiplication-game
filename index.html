<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乘法學習挑戰</title><style>:root{--ink:#263238;--muted:#607d8b;--p:#5b63c8;--good:#2e7d32;--bad:#c62828;--line:#dfe7fd}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:linear-gradient(180deg,#eef7ff,#fff8e6);color:var(--ink);min-height:100vh;padding:18px}.app{max-width:980px;margin:auto;background:#fff;border-radius:28px;padding:24px;box-shadow:0 14px 35px #455a6422}h1{text-align:center;font-size:clamp(30px,5vw,50px);margin:3px}.sub{text-align:center;color:var(--muted);font-size:18px}.screen{display:none}.screen.on{display:block}.sectionTitle{font-size:22px;margin:26px 0 12px;border-left:7px solid var(--p);padding-left:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.card{border:3px solid var(--line);background:#fff;border-radius:22px;padding:20px;text-align:left;cursor:pointer}.card:hover{border-color:var(--p)}.card b{display:block;font-size:23px;margin:7px 0}.card span{color:var(--muted);line-height:1.5}.emoji{font-size:40px}.rule{background:#eef1ff;border-radius:18px;padding:15px;text-align:center;font-size:clamp(18px,4vw,27px);font-weight:900;margin:18px 0}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.pill{background:#f1f3f4;border-radius:999px;padding:9px 14px;font-weight:800}.prompt{text-align:center;font-size:20px;font-weight:800;margin-top:20px}.q{text-align:center;font-size:clamp(38px,8vw,68px);font-weight:900;margin:18px 0 24px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ans{border:2px solid #dfe4ec;background:#fff;border-radius:19px;min-height:105px;font-size:clamp(23px,5vw,36px);font-weight:900;cursor:pointer;padding:12px}.ans.ok{background:#e8f5e9;border-color:#66bb6a;color:var(--good)}.ans.no{background:#ffebee;border-color:#ef9a9a;color:var(--bad)}.feedback{text-align:center;min-height:58px;font-size:21px;font-weight:900;margin-top:15px;line-height:1.5}.history{display:flex;justify-content:center;gap:8px;margin:14px}.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#eceff1;font-weight:900}.dot.ok{background:#c8e6c9;color:var(--good)}.dot.no{background:#ffcdd2;color:var(--bad)}.status{text-align:center;color:var(--muted);margin:10px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}button.primary,button.secondary{border:0;border-radius:15px;padding:13px 20px;font-size:18px;font-weight:900;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#eceff1}.result{text-align:center;padding:24px}.t{font-size:80px}@media(max-width:600px){.answers{grid-template-columns:1fr}.app{padding:16px}}</style></head><body><main class="app"><h1>🎯 乘法學習挑戰</h1><p class="sub">先熟練九九乘法，再挑戰交換與共同乘數。</p><section id="menu" class="screen on"><h2 class="sectionTitle">① 九九乘法分級挑戰</h2><div class="cards"><button class="card" data-mode="table" data-factors="2,5" data-label="九九乘法｜2、5倍"><div class="emoji">🌱</div><b>第一關｜2、5 倍</b><span>從規律明顯的乘法開始。</span></button><button class="card" data-mode="table" data-factors="3,4" data-label="九九乘法｜3、4倍"><div class="emoji">🐣</div><b>第二關｜3、4 倍</b><span>練習常見基礎乘法。</span></button><button class="card" data-mode="table" data-factors="6,7" data-label="九九乘法｜6、7倍"><div class="emoji">🚗</div><b>第三關｜6、7 倍</b><span>提升乘法熟練度。</span></button><button class="card" data-mode="table" data-factors="8,9" data-label="九九乘法｜8、9倍"><div class="emoji">🚀</div><b>第四關｜8、9 倍</b><span>挑戰九九乘法後半段。</span></button><button class="card" data-mode="table" data-factors="1,2,3,4,5,6,7,8,9" data-label="九九乘法｜完整挑戰"><div class="emoji">🏆</div><b>第五關｜全部九九乘法</b><span>1～9 綜合隨機挑戰。</span></button></div><h2 class="sectionTitle">② 乘法概念進階挑戰</h2><div class="cards"><button class="card" data-mode="basic" data-label="初級｜乘法交換律"><div class="emoji">🔄</div><b>初級｜乘法交換律</b><span>6 × 8 ↔ 8 × 6<br>找出交換兩個乘數後的算式。</span></button><button class="card" data-mode="mid" data-label="中級｜共同乘數合併"><div class="emoji">🧩</div><b>中級｜共同乘數合併</b><span>6 × 8 ＋ 2 × 8<br>＝ (6＋2) × 8</span></button></div><p class="status">所有關卡：最近 6 題答對至少 5 題即可過關。</p></section><section id="game" class="screen"><div class="top"><span class="pill" id="modeLabel"></span><span class="pill">總答題 <span id="total">0</span> 題</span></div><div class="rule" id="rule"></div><div class="prompt" id="prompt"></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="history" id="history"></div><div class="status" id="status"></div><div class="actions"><button class="primary" id="next" hidden>下一題</button><button class="secondary" id="back">回到首頁</button></div></section><section id="result" class="screen"><div class="result"><div class="t">🏆</div><h2 id="resultTitle">挑戰成功！</h2><p id="summary"></p><div class="actions"><button class="primary" id="again">再挑戰一次</button><button class="secondary" id="choose">回到首頁</button></div></div></section></main><script>const $=id=>document.getElementById(id);let mode='table',factors=[],label='',recent=[],total=0,correct=0,current=null,locked=false;function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){for(let i=a.length-1;i;i--){let j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}function clean(s){return s.replace(/\s/g,'')}function start(btn){mode=btn.dataset.mode;label=btn.dataset.label;factors=btn.dataset.factors?btn.dataset.factors.split(',').map(Number):[];recent=[];total=0;correct=0;$('modeLabel').textContent=label;if(mode==='table'){$('rule').textContent='看清楚兩個乘數，選出正確的乘積。';$('prompt').textContent='請選出正確答案。'}else if(mode==='basic'){$('rule').textContent='交換位置，乘積不變：3 × 7 = 7 × 3';$('prompt').textContent='哪一個算式和下面的算式互為交換律？'}else{$('rule').textContent='找共同乘數：6 × 8 ＋ 2 × 8 = ( 6 ＋ 2 ) × 8';$('prompt').textContent='下面的算式可以合併成哪一個算式？'}show('game');render();newQ()}function newQ(){locked=false;$('next').hidden=true;$('feedback').textContent='';let opts=[];if(mode==='table'){let a=factors[r(0,factors.length-1)],b=r(1,9);if(Math.random()<.5)[a,b]=[b,a];let answer=String(a*b);current={a,b,answer};$('q').textContent=`${a} × ${b} = ?`;let s=new Set([a*b]);let pool=[a*b+a,a*b-a,a*b+b,a*b-b,a*b+1,a*b-1,a*b+2,a*b-2,r(1,9)*r(1,9)].filter(x=>x>0&&x<=81);shuffle(pool).forEach(x=>{if(s.size<4)s.add(x)});while(s.size<4)s.add(r(1,81));opts=[...s].map(String)}else if(mode==='basic'){let a=r(2,9),b=r(2,9);while(a===b)b=r(2,9);let answer=`${b} × ${a}`;current={a,b,answer};$('q').textContent=`${a} × ${b}`;let pool=[`${a} × ${b}`,`${b} × ${Math.max(1,a-1)}`,`${Math.max(1,b-1)} × ${a}`,`${a} × ${Math.min(9,b+1)}`];opts=[answer,...shuffle([...new Set(pool.filter(x=>x!==answer))]).slice(0,3)]}else{let x=r(1,9),y=r(1,9),k=r(2,9);while(x===y)y=r(1,9);let answer=`( ${x} ＋ ${y} ) × ${k}`;current={x,y,k,answer};$('q').textContent=`${x} × ${k} ＋ ${y} × ${k}`;opts=[answer,`( ${x} ＋ ${k} ) × ${y}`,`${x} × ( ${y} ＋ ${k} )`,`( ${x} ＋ ${y} ) × ${Math.max(1,k-1)}`]}let box=$('answers');box.innerHTML='';shuffle(opts).forEach(t=>{let b=document.createElement('button');b.className='ans';b.textContent=t;b.onclick=()=>check(b,t);box.appendChild(b)})}function check(btn,t){if(locked)return;locked=true;total++;let ok=clean(t)===clean(current.answer);if(ok)correct++;recent.push(ok);if(recent.length>6)recent.shift();[...$('answers').children].forEach(b=>{b.disabled=true;if(clean(b.textContent)===clean(current.answer))b.classList.add('ok')});if(!ok)btn.classList.add('no');let f=$('feedback');if(mode==='table')f.textContent=ok?'✅ 答對了！':`❌ 正確答案是 ${current.answer}`;else if(mode==='basic')f.textContent=ok?'✅ 答對了！交換兩個乘數的位置，乘積不變。':`❌ ${current.a} × ${current.b} = ${current.answer}`;else f.textContent=ok?`✅ 答對了！共同乘數是 ${current.k}。`:`❌ 找重複出現的數 ${current.k}，再把另外兩個數合起來。`;f.style.color=ok?'#2e7d32':'#c62828';render();if(recent.length===6&&recent.filter(Boolean).length>=5)setTimeout(pass,650);else $('next').hidden=false}function render(){$('total').textContent=total;let h=$('history');h.innerHTML='';for(let i=0;i<6;i++){let d=document.createElement('span');d.className='dot';if(i<recent.length){d.textContent=recent[i]?'✓':'×';d.classList.add(recent[i]?'ok':'no')}else d.textContent='•';h.appendChild(d)}$('status').textContent=`最近 ${recent.length}/6 題｜答對 ${recent.filter(Boolean).length} 題｜過關需 5 題`}function pass(){$('resultTitle').textContent=`${label} 過關！`;$('summary').textContent=`本次共作答 ${total} 題，答對 ${correct} 題；最近 6 題答對 ${recent.filter(Boolean).length} 題。`;show('result')}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b));$('next').onclick=newQ;$('back').onclick=()=>show('menu');$('choose').onclick=()=>show('menu');$('again').onclick=()=>{let b=[...document.querySelectorAll('[data-mode]')].find(x=>x.dataset.label===label);start(b)};</script></body></html>
