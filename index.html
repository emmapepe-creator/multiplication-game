<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乘法交換與合併挑戰</title><style>:root{--bg:#f5f8ff;--card:#fff;--ink:#263238;--muted:#607d8b;--p:#5b63c8;--good:#2e7d32;--bad:#c62828;--line:#dfe7fd}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:linear-gradient(180deg,#eef7ff,#fff8e6);color:var(--ink);min-height:100vh;padding:18px}.app{max-width:940px;margin:auto;background:#fff;border-radius:28px;padding:24px;box-shadow:0 14px 35px #455a6422}h1{text-align:center;font-size:clamp(30px,5vw,48px);margin:4px}.sub{text-align:center;color:var(--muted);font-size:18px}.screen{display:none}.screen.on{display:block}.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:28px}.level{border:3px solid var(--line);background:#fff;border-radius:24px;padding:25px;text-align:left;cursor:pointer}.level:hover{border-color:var(--p)}.level b{display:block;font-size:27px;margin:8px 0}.level span{font-size:17px;color:var(--muted);line-height:1.6}.emoji{font-size:50px}.rule{background:#eef1ff;border-radius:18px;padding:16px;text-align:center;font-size:clamp(19px,4vw,28px);font-weight:900;margin:18px 0}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.pill{background:#f1f3f4;border-radius:999px;padding:9px 14px;font-weight:800}.prompt{text-align:center;font-size:20px;font-weight:800;margin-top:22px}.q{text-align:center;font-size:clamp(36px,8vw,64px);font-weight:900;margin:18px 0 24px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ans{border:2px solid #dfe4ec;background:#fff;border-radius:19px;min-height:100px;font-size:clamp(23px,5vw,34px);font-weight:900;cursor:pointer;padding:12px}.ans.ok{background:#e8f5e9;border-color:#66bb6a;color:var(--good)}.ans.no{background:#ffebee;border-color:#ef9a9a;color:var(--bad)}.feedback{text-align:center;min-height:60px;font-size:21px;font-weight:900;margin-top:16px;line-height:1.5}.history{display:flex;justify-content:center;gap:8px;margin:15px}.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#eceff1;font-weight:900}.dot.ok{background:#c8e6c9;color:var(--good)}.dot.no{background:#ffcdd2;color:var(--bad)}.status{text-align:center;color:var(--muted)}button.primary,button.secondary{border:0;border-radius:15px;padding:13px 20px;font-size:18px;font-weight:900;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#eceff1}.next{display:block;margin:15px auto}.result{text-align:center;padding:25px}.result .t{font-size:80px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}@media(max-width:600px){.answers{grid-template-columns:1fr}.app{padding:16px}}</style></head><body><main class="app"><h1>🧠 乘法交換與合併挑戰</h1><p class="sub">從交換兩個乘數，到找出共同乘數。</p><section id="menu" class="screen on"><div class="levels"><button class="level" data-mode="basic"><div class="emoji">🌱</div><b>初級｜乘法交換律</b><span>例如：6 × 8 ↔ 8 × 6<br>找出交換兩個乘數後的算式。</span></button><button class="level" data-mode="mid"><div class="emoji">🚀</div><b>中級｜共同乘數合併</b><span>例如：6 × 8 ＋ 2 × 8<br>＝ (6＋2) × 8</span></button></div><p class="status">每一級：最近 6 題答對至少 5 題即可過關。</p></section><section id="game" class="screen"><div class="top"><span class="pill" id="modeLabel"></span><span class="pill">總答題 <span id="total">0</span> 題</span></div><div class="rule" id="rule"></div><div class="prompt" id="prompt"></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="history" id="history"></div><div class="status" id="status"></div><button class="primary next" id="next" hidden>下一題</button><div class="actions"><button class="secondary" id="back">回到選級</button></div></section><section id="result" class="screen"><div class="result"><div class="t">🏆</div><h2 id="resultTitle">挑戰成功！</h2><p id="summary"></p><div class="actions"><button class="primary" id="again">再挑戰一次</button><button class="secondary" id="choose">選擇其他等級</button></div></div></section></main><script>const $=id=>document.getElementById(id);let mode='basic',recent=[],total=0,correct=0,current=null,locked=false;function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){for(let i=a.length-1;i;i--){let j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}function clean(s){return s.replace(/\s/g,'')}function start(m){mode=m;recent=[];total=0;correct=0;$('modeLabel').textContent=m==='basic'?'🌱 初級｜乘法交換律':'🚀 中級｜共同乘數合併';$('rule').textContent=m==='basic'?'交換位置，乘積不變：3 × 7 = 7 × 3':'找共同乘數：6 × 8 ＋ 2 × 8 = ( 6 ＋ 2 ) × 8';$('prompt').textContent=m==='basic'?'哪一個算式和下面的算式互為交換律？':'下面的算式可以合併成哪一個算式？';show('game');render();newQ()}function newQ(){locked=false;$('next').hidden=true;$('feedback').textContent='';let opts=[];if(mode==='basic'){let a=r(2,9),b=r(2,9);while(a===b)b=r(2,9);let answer=`${b} × ${a}`;current={a,b,answer};$('q').textContent=`${a} × ${b}`;let pool=[`${a} × ${b}`,`${b} × ${Math.max(1,a-1)}`,`${Math.max(1,b-1)} × ${a}`,`${a} × ${Math.min(9,b+1)}`,`${Math.min(9,a+1)} × ${b}`];opts=[answer,...shuffle([...new Set(pool.filter(x=>x!==answer))]).slice(0,3)]}else{let x=r(1,9),y=r(1,9),k=r(2,9);while(x===y)y=r(1,9);let answer=`( ${x} ＋ ${y} ) × ${k}`;current={x,y,k,answer};$('q').textContent=`${x} × ${k} ＋ ${y} × ${k}`;let pool=[`( ${x} ＋ ${k} ) × ${y}`,`${x} × ( ${y} ＋ ${k} )`,`( ${x} ＋ ${y} ) × ${Math.max(1,k-1)}`,`( ${x} × ${y} ) ＋ ${k}`];opts=[answer,...shuffle(pool).slice(0,3)]}let box=$('answers');box.innerHTML='';shuffle(opts).forEach(t=>{let b=document.createElement('button');b.className='ans';b.textContent=t;b.onclick=()=>check(b,t);box.appendChild(b)})}function check(btn,t){if(locked)return;locked=true;total++;let ok=clean(t)===clean(current.answer);if(ok)correct++;recent.push(ok);if(recent.length>6)recent.shift();[...$('answers').children].forEach(b=>{b.disabled=true;if(clean(b.textContent)===clean(current.answer))b.classList.add('ok')});if(!ok)btn.classList.add('no');let f=$('feedback');if(mode==='basic')f.textContent=ok?'✅ 答對了！交換兩個乘數的位置，乘積不變。':`❌ 再看一次：${current.a} × ${current.b} = ${current.answer}`;else f.textContent=ok?`✅ 答對了！共同乘數是 ${current.k}。`:`❌ 找重複出現的數 ${current.k}，再把另外兩個數合起來。`;f.style.color=ok?'#2e7d32':'#c62828';render();if(recent.length===6&&recent.filter(Boolean).length>=5)setTimeout(pass,650);else $('next').hidden=false}function render(){$('total').textContent=total;let h=$('history');h.innerHTML='';for(let i=0;i<6;i++){let d=document.createElement('span');d.className='dot';if(i<recent.length){d.textContent=recent[i]?'✓':'×';d.classList.add(recent[i]?'ok':'no')}else d.textContent='•';h.appendChild(d)}$('status').textContent=`最近 ${recent.length}/6 題｜答對 ${recent.filter(Boolean).length} 題｜過關需 5 題`}function pass(){$('resultTitle').textContent=mode==='basic'?'初級挑戰過關！':'中級挑戰過關！';$('summary').textContent=`本次共作答 ${total} 題，答對 ${correct} 題。最近 6 題答對 ${recent.filter(Boolean).length} 題。`;show('result')}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));$('next').onclick=newQ;$('back').onclick=()=>show('menu');$('choose').onclick=()=>show('menu');$('again').onclick=()=>start(mode);</script></body></html>
